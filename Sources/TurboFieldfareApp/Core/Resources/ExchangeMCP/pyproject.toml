[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exchange-mcp-readonly"
version = "0.2.0"
description = "Read-only EWS mail and calendar tools with explicit date ranges"
requires-python = ">=3.10"
dependencies = [
    "exchangelib==5.6.0",
    "mcp[cli]==1.29.1",
    "pydantic==2.13.5",
]

[project.scripts]
exchange-mcp = "exchange_mcp.server:main"

[tool.setuptools.packages.find]
include = ["exchange_mcp*"]
